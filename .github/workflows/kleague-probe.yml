name: kleague-probe
on:
  push:
    branches: [collector-kleague]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe/kleague_probe2.py
      - name: publish raw
        run: |
          cd out
          git init -q -b kleague-raw
          git config user.name Kang-Hoon
          git config user.email khlee3179@gmail.com
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -q -m "kleague probe raw"
          git push -f origin kleague-raw
